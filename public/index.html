                                            disabled={loading}
                                            className="chat-input"
                                        />
                                        <button
                                            onClick={handleSendMessage}
                                            disabled={loading || !inputValue.trim()}
                                            className="button"
                                        >
                                            Send
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'reports' && (
                            <div>
                                <div style={{ marginBottom: '1.5rem', padding: '1rem', background: '#f8f9fa', borderRadius: '8px' }}>
                                    <strong>📊 Custom Reports</strong>
                                    <p style={{ margin: '0.5rem 0 0 0', color: '#6c757d', fontSize: '0.9rem' }}>
                                        Generate custom reports and analytics for your HOA community.
                                    </p>
                                </div>

                                <div className="card" style={{ marginBottom: '1rem' }}>
                                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                                        <div>
                                            <h3 style={{ margin: '0 0 0.5rem 0', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                                💰 Late Fee Summary
                                            </h3>
                                            <p style={{ margin: 0, color: '#6c757d', fontSize: '0.9rem' }}>
                                                AI-powered extraction of HOA fees and late charges from your documents
                                            </p>
                                        </div>
                                        <button 
                                            className="button"
                                            onClick={handleGenerateLateFeeReport}
                                            disabled={generatingReport}
                                        >
                                            {generatingReport ? 'Generating...' : 'Generate Report'}
                                        </button>
                                    </div>
                                </div>

                                {generatingReport && (
                                    <div style={{ 
                                        padding: '2rem', 
                                        textAlign: 'center',
                                        background: '#f8f9fa',
                                        borderRadius: '8px',
                                        marginBottom: '1rem'
                                    }}>
                                        <div className="typing-indicator" style={{ display: 'inline-flex' }}>
                                            <span></span>
                                            <span></span>
                                            <span></span>
                                        </div>
                                        <p style={{ marginTop: '1rem', color: '#6c757d' }}>
                                            Analyzing documents with AI... This may take a moment.
                                        </p>
                                    </div>
                                )}

                                {reportData && !generatingReport && (
                                    <div className="card" style={{ marginBottom: '1rem' }}>
                                        <h3 style={{ marginBottom: '1rem' }}>📊 Report Results</h3>
                                        <div style={{ overflowX: 'auto' }}>
                                            <table style={{ 
                                                width: '100%', 
                                                borderCollapse: 'collapse',
                                                fontSize: '0.9rem'
                                            }}>
                                                <thead>
                                                    <tr style={{ background: '#f8f9fa', borderBottom: '2px solid #dee2e6' }}>
                                                        <th style={{ padding: '0.75rem', textAlign: 'left' }}>Document</th>
                                                        <th style={{ padding: '0.75rem', textAlign: 'left' }}>Community</th>
                                                        <th style={{ padding: '0.75rem', textAlign: 'left' }}>HOA Fee</th>
                                                        <th style={{ padding: '0.75rem', textAlign: 'left' }}>HOA Due Date</th>
                                                        <th style={{ padding: '0.75rem', textAlign: 'left' }}>Late Fee</th>
                                                        <th style={{ padding: '0.75rem', textAlign: 'left' }}>Late Fee Due Date</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {reportData.map((row, idx) => (
                                                        <tr key={idx} style={{ borderBottom: '1px solid #e9ecef' }}>
                                                            <td style={{ padding: '0.75rem' }}>
                                                                <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                                                    📄 {row.filename}
                                                                </div>
                                                            </td>
                                                            <td style={{ padding: '0.75rem' }}>
                                                                {row.community_name !== 'N/A' && row.community_name !== 'COMMUNITY NAME' && (
                                                                    <span style={{ 
                                                                        padding: '0.25rem 0.5rem',
                                                                        background: '#e7f3ff',
                                                                        borderRadius: '4px',
                                                                        fontSize: '0.85rem'
                                                                    }}>
                                                                        🏘️ {row.community_name}
                                                                    </span>
                                                                )}
                                                                {(row.community_name === 'N/A' || row.community_name === 'COMMUNITY NAME') && (
                                                                    <span style={{ color: '#6c757d' }}>{row.community_name}</span>
                                                                )}
                                                            </td>
                                                            <td style={{ padding: '0.75rem', fontWeight: row.hoa_fee !== 'Not found' && row.hoa_fee !== 'N/A' && row.hoa_fee !== 'Error' ? '600' : 'normal' }}>
                                                                {row.hoa_fee}
                                                            </td>
                                                            <td style={{ padding: '0.75rem' }}>
                                                                {row.hoa_due_date}
                                                            </td>
                                                            <td style={{ padding: '0.75rem', fontWeight: row.late_fee !== 'Not found' && row.late_fee !== 'N/A' && row.late_fee !== 'Error' ? '600' : 'normal', color: row.late_fee !== 'Not found' && row.late_fee !== 'N/A' && row.late_fee !== 'Error' ? '#dc3545' : 'inherit' }}>
                                                                {row.late_fee}
                                                            </td>
                                                            <td style={{ padding: '0.75rem' }}>
                                                                {row.late_fee_due_date}
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                        <div style={{ marginTop: '1rem', padding: '0.75rem', background: '#f8f9fa', borderRadius: '4px', fontSize: '0.85rem', color: '#6c757d' }}>
                                            ℹ️ Data extracted using AI. Please verify accuracy against original documents.
                                        </div>
                                    </div>
                                )}

                                {!reportData && !generatingReport && (
                                    <div style={{ 
                                        padding: '2rem', 
                                        textAlign: 'center', 
                                        color: '#6c757d',
                                        background: '#f8f9fa',
                                        borderRadius: '8px',
                                        border: '2px dashed #dee2e6'
                                    }}>
                                        <div style={{ fontSize: '3rem', marginBottom: '1rem' }}>📈</div>
                                        <p style={{ margin: 0, fontSize: '0.95rem' }}>
                                            Click "Generate Report" to analyze your documents
                                        </p>
                                    </div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Bulk Upload Confirmation Modal */}
                    {showModal && <BulkUploadModal uploadResult={modalData} onClose={closeModal} />}
                    
                    {/* Edit Community Name Modal */}
                    {showEditModal && (
                        <EditCommunityNameModal
                            doc={editingDoc}
                            value={editCommunityName}
                            onChange={setEditCommunityName}
                            onSave={handleSaveEditCommunityName}
                            onCancel={handleCancelEdit}
                        />
                    )}
                    
                    {/* Duplicate Warning Modal */}
                    {showDuplicateWarning && (
                        <DuplicateWarningModal 
                            filename={duplicateFile} 
                            onConfirm={handleDuplicateConfirm}
                            onCancel={handleDuplicateCancel}
                        />
                    )}
                </div>
            );
        }

        // Resident Dashboard
        function ResidentDashboard({ user, onLogout }) {
            const [documents, setDocuments] = useState([]);
            const [messages, setMessages] = useState([]);
            const [inputValue, setInputValue] = useState('');
            const [loading, setLoading] = useState(false);
            const messagesEndRef = useRef(null);
            const chatInputRef = useRef(null);

            useEffect(() => {
                loadDocuments();
                setMessages([
                    {
                        role: 'assistant',
                        content: 'Hello! I\'m your HOA assistant. Ask me anything about your community documents, rules, regulations, or procedures.',
                    }
                ]);
            }, []);

            const loadDocuments = async () => {
                try {
                    const data = await apiCall('/documents');
                    setDocuments(data.documents);
                } catch (err) {
                    console.error('Failed to load documents:', err);
                }
            };

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            useEffect(scrollToBottom, [messages]);

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!inputValue.trim() || loading) return;

                const userMessage = { role: 'user', content: inputValue.trim() };
                setMessages(prev => [...prev, userMessage]);
                setInputValue('');
                setLoading(true);

                try {
                    const response = await apiCall('/chat', {
                        method: 'POST',
                        body: JSON.stringify({ question: inputValue.trim() })
                    });

                    const assistantMessage = {
                        role: 'assistant',
                        content: response.answer,
                        documentsReferenced: response.documentsReferenced
                    };

                    setMessages(prev => [...prev, assistantMessage]);
                } catch (err) {
                    const errorMessage = {
                        role: 'assistant',
                        content: `Sorry, I encountered an error: ${err.message}`,
                        error: true
                    };
                    setMessages(prev => [...prev, errorMessage]);
                } finally {
                    setLoading(false);
                    
                    // Auto-focus input for next question
                    setTimeout(() => {
                        chatInputRef.current?.focus();
                    }, 100);
                }
            };

            const suggestedQuestions = [
                "What are the pool hours?",
                "What are the parking rules?",
                "How do I contact the HOA board?",
                "What are the pet policies?"
            ];

            return (
                <div className="container">
                    <div className="header">
                        <h1>🏠 Resident Support AI</h1>
                        <p>Ask questions about your HOA documents</p>
                    </div>

                    <div className="user-info">
                        <div>
                            <strong>Logged in as:</strong> {user.username} ({user.role})
                        </div>
                        <button onClick={onLogout} className="logout-btn">Logout</button>
                    </div>

                    <div className="card">
                        <h3 style={{ marginBottom: '1rem' }}>💬 Chat with AI Assistant</h3>
                        
                        {documents.length === 0 && (
                            <div className="alert alert-warning" style={{ marginBottom: '1rem' }}>
                                No documents available yet. Your HOA manager needs to upload documents first.
                            </div>
                        )}

                        <div className="chat-container">
                            <div className="messages">
                                {messages.map((msg, idx) => (
                                    <div key={idx} className={`message ${msg.role} ${msg.error ? 'error' : ''}`}>
                                        {msg.content}
                                        {msg.documentsReferenced && msg.documentsReferenced.length > 0 && (
                                            <div style={{ marginTop: '0.5rem', fontSize: '0.875rem', opacity: 0.8 }}>
                                                📚 Referenced: {msg.documentsReferenced.map(d => d.name).join(', ')}
                                            </div>
                                        )}
                                    </div>
                                ))}
                                {loading && (
                                    <div className="message assistant">
                                        <em>Thinking...</em>
                                    </div>
                                )}
                                <div ref={messagesEndRef} />
                            </div>

                            <form onSubmit={handleSubmit} className="chat-input-container">
                                <input
                                    ref={chatInputRef}
                                    type="text"
                                    className="chat-input"
                                    value={inputValue}
                                    onChange={(e) => setInputValue(e.target.value)}
                                    placeholder="Ask a question about your HOA..."
                                    disabled={loading}
                                />
                                <button type="submit" className="button" disabled={loading || !inputValue.trim()}>
                                    Send
                                </button>
                            </form>
                        </div>

                        {messages.length === 1 && (
                            <div style={{ marginTop: '1rem' }}>
                                <p style={{ marginBottom: '0.5rem', color: '#6c757d', fontWeight: 500 }}>
                                    Try asking:
                                </p>
                                <div style={{ display: 'flex', gap: '0.5rem', flexWrap: 'wrap' }}>
                                    {suggestedQuestions.map((q, idx) => (
                                        <button
                                            key={idx}
                                            className="button button-secondary"
                                            onClick={() => setInputValue(q)}
                                            style={{ fontSize: '0.875rem', padding: '0.5rem 1rem' }}
                                        >
                                            {q}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="card">
                        <h3 style={{ marginBottom: '1rem' }}>📚 Available Documents</h3>
                        {documents.length === 0 ? (
                            <div className="alert alert-info">
                                No documents available yet.
                            </div>
                        ) : (
                            <div className="document-list">
                                {documents.map(doc => (
                                    <div key={doc.id} className="document-item">
                                        <div className="document-info">
                                            <div className="document-name">📄 {doc.original_name}</div>
                                            <div className="document-meta">
                                                Uploaded {new Date(doc.uploaded_at).toLocaleDateString()}
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Main App Component
        function App() {
            const [user, setUser] = useState(null);

            useEffect(() => {
                const savedUser = localStorage.getItem('user');
                if (savedUser) {
                    setUser(JSON.parse(savedUser));
                }
            }, []);

            const handleLogin = (userData) => {
                setUser(userData);
            };

            const handleLogout = () => {
                localStorage.removeItem('token');
                localStorage.removeItem('user');
                setUser(null);
            };

            if (!user) {
                return <Login onLogin={handleLogin} />;
            }

            if (user.role === 'manager') {
                return <ManagerDashboard user={user} onLogout={handleLogout} />;
            }

            return <ResidentDashboard user={user} onLogout={handleLogout} />;
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
